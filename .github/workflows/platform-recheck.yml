name: v1.2 platform checks
on:
  push:
    branches: ['ci/v1.2-platform-checks']
permissions:
  contents: read
  actions: read
jobs:
  ubuntu:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: syncssh-ubuntu
          path: packages
          run-id: 45394042747
          github-token: ${{ github.token }}
      - shell: bash
        run: |
          package=$(find "$PWD/packages" -type f -name '*.deb' -print -quit)
          test -n "$package"
          sudo apt-get install -y xvfb "$package"
          SYNCSSH_TEST_EXECUTABLE=/opt/SyncSSH/syncssh xvfb-run -a node --test --test-name-pattern 'v1 desktop|v1.2' test/desktop.test.cjs


