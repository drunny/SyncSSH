name: v1.2 platform checks
on:
  push:
    branches: ['ci/v1.2-platform-checks']
permissions:
  contents: read
  actions: read
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm test
      - run: npm run package:desktop
      - shell: bash
        run: |
          test "$(uname -m)" = arm64
          image=$(find dist* -maxdepth 1 -name '*-macos-arm64-preview.dmg' -print -quit)
          volume="$RUNNER_TEMP/syncssh-dmg"
          hdiutil verify "$image"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$volume"
          trap 'hdiutil detach "$volume"' EXIT
          codesign --verify --deep --strict "$volume/SyncSSH.app"
          SYNCSSH_TEST_EXECUTABLE="$volume/SyncSSH.app/Contents/MacOS/Electron" npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: syncssh-macos
          path: dist*/*.dmg
          if-no-files-found: error
  ubuntu:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: syncssh-ubuntu
          path: packages
          run-id: 45394042747
          github-token: ${{ github.token }}
      - shell: bash
        run: |
          sudo apt-get install -y xvfb "$PWD"/packages/*.deb
          SYNCSSH_TEST_EXECUTABLE=/opt/SyncSSH/syncssh xvfb-run -a node --test --test-name-pattern 'v1 desktop|v1.2' test/desktop.test.cjs

